<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>{{ title | default: "Galaxy Games Fest" }}</title>
    <link rel="stylesheet" href="https://unpkg.com/98.css" />
		<link rel="stylesheet" href="/assets/css/styles.css">
	</head>
	<body class="overflow-x-hidden bg-black">
    <img src="/src/img/2026/y2k-globe-16-9.png" class="fixed top-0 left-0 w-full h-full z-[-2] object-cover pointer-events-none" id="base" />
    <div id="shine-ring" class="fixed top-[-350px] left-0 aspect-square right-0 z-[-2] pointer-events-none">
      {% for shine in shineImages %}
        <img
          src="{{ shine.src }}"
          class="shine absolute inset-0 w-full h-full object-cover"
          data-angle="{{ shine.angle }}"
          alt=""
        />
      {% endfor %}
    </div>

		<header class="fixed top-0 left-0 right-0 z-10 flex flex-col md:flex-row justify-between p-8 gap-4">
			<div>
        <div class="window">
          <div class="title-bar">
            <div class="title-bar-text">
              Galaxy Games Fest
            </div>
            <div class="title-bar-controls">
              <button aria-label="Minimize"></button>
              <button aria-label="Maximize"></button>
              <button aria-label="Close"></button>
            </div>
          </div>
          <div class="window-body">
            <section class="field-row" style="justify-content: flex-end">
              <a href="/"><button>GO</button></a>
            </section>
          </div>
        </div>
      </div>
			<div>
        <div class="window">
          <div class="title-bar">
            <div class="title-bar-text">
              Galaxy Games Fest
            </div>
            <div class="title-bar-controls">
              <button aria-label="Minimize"></button>
              <button aria-label="Maximize"></button>
              <button aria-label="Close"></button>
            </div>
          </div>
          <div class="window-body">
            <section class="field-row" style="justify-content: flex-end">
              <a href="https://linktr.ee/LiquidCatStudio" target="_blank"><button>Socials</button></a>
              <a href="/learnmore"><button>Schedule</button></a>
              <a href="/speakers"><button>Speakers</button></a>
              <a href="/games"><button>Games</button></a>
              <a href="/2025"><button>2025</button></a>
            </section>
          </div>
        </div>

        <ul class="flex flex-row justify-center gap-4">
          <li></li>
        </ul>
      </div>
		</header>

    <main class="{% if not isLanding %}flex justify-center{% endif %}">
      {% if not isLanding %}
        <div class="w-full md:w-1/2 mt-32 p-8">
          {{ content }}
        </div>
      {% else %}
        <div class="p-8">
          {{ content }}
        </div>
      {% endif %}
    </main>

		<footer class="text-center p-8">
		</footer>

<canvas id="starCanvas" class="fixed top-0 left-0 right-0 bottom-0 z-[-1]"></canvas>
<script src="/src/js/starCanvas.js"></script>

<script type="module">
  import { animate, scroll } from 'https://cdn.jsdelivr.net/npm/motion@11/+esm';

  console.log('Motion loaded');

  const clouds = document.getElementById('clouds');
  const lights = document.getElementById('lights');
  const logo   = document.getElementById('logo');

  const about_text = document.getElementById('about_text');
  const schedule_text = document.getElementById('schedule_text');
  const partners_text = document.getElementById('partners_text');
  const faq_text = document.getElementById('faq_text');

  const faq_body = document.getElementById('faq_body');
  const faq2_body = document.getElementById('faq2_body');

  // Parallax for clouds
  if (clouds) {
    scroll(
      animate(clouds, { y: [0,  50] }, { duration: 1, easing: 'linear' })
    );
  } else {
    console.warn('Clouds element not found – check the ID!');
  }

  // Parallax for lights
  if (lights) {
    scroll(
      animate(lights, { y: [0, 500] }, { duration: 1, easing: 'linear' })
    );
  } else {
    console.warn('Lights element not found – check the ID!');
  }

  // Logo fade
  if (logo) {
    const fade = animate(
      logo,
      { opacity: [0, 1] },
      { duration: 3, fill: 'both', easing: 'ease-out' }
    );
    scroll(fade, { offset: ['start 70%', 'start 40%'] });
  } else {
    console.warn('Logo element not found – check the ID!');
  }

  // Asteroid parallax (class-based, always run)
  scroll(
    animate(".asteroid.asteroid-up", { y: [0, -100] }, { duration: 1, easing: 'linear' })
  );
  scroll(
    animate(".asteroid.asteroid-down", { y: [0, 100] }, { duration: 1, easing: 'linear' })
  );

  // Shine ring: each image fans outward along its angle as you scroll
  const shineEls = document.querySelectorAll('.shine');
  if (shineEls.length) {
    const maxRadius = Math.min(window.innerWidth, window.innerHeight) * 0.45;
    shineEls.forEach((el) => {
      const angleRad = ((parseFloat(el.dataset.angle) - 90) * Math.PI) / 180;
      scroll(
        animate(
          el,
          {
            x: [0, maxRadius * Math.cos(angleRad)],
            y: [0, maxRadius * Math.sin(angleRad)],
          },
          { duration: 1, easing: 'linear' }
        )
      );
    });
  }
</script>

	</body>
</html>
